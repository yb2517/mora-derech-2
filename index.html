<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מורה הדרך 2.0</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components/index.css">
</head>
<body>

<header class="app-bar">
  <h1 class="app-bar__title">מורה הדרך 2.0</h1>
  <p class="app-bar__note">מסלול רחוב יפו, ירושלים</p>
</header>

<main class="layout" id="app"></main>

<!--
  נקודת הכניסה. מסמך הבנייה גרסה 2.2 סעיף 5, ופער 21 של שלב 1
  בהכרעת בעלת הפרויקט: הקובץ היחיד הוא גם יעד ההרצה של decision-04
  וגם המקום שמרכיב את המערכת, ולכן אין קובץ הרכבה נפרד.

  מה הקובץ הזה עושה, ואת זה בלבד:
    1. קורא את שלוש טבלאות הנתונים.
    2. בונה את דרייבר האחסון, את ה-Repository ואת ה-Orchestrator.
    3. בונה את המתאמים מהמכשיר ומזריק אותם למי שמשתמש בהם (מפה 4.1
       גרסה 3.8: "נקודת הכניסה היא שמרכיבה את המתאמים ומזריקה אותם,
       ולכן היא רשאית לייבא מ-/connectors/ בלבד").
    4. טוענת את מודולי האוטומציה מטבלת המודולים, ומחברת אותם למחזור
       חיי הסשן שהמסך חושף (הכרעות 6 ו-7 בתוכנית שלב 5).
    5. מגישה את המסכים, ומזריקה לכל אחד את שם הפונה שלו, את ערכי
       ה-reference שהוא צריך, ואת הציוד שלו.

  מה הוא אינו עושה: אינו מכיל לוגיקה עסקית, אינו נוגע באחסון (חוק
  ברזל 3: רק הדרייבר), ואינו מחזיק שם פונה או ערך משתנה ככתוב בקוד.
  שניהם נקראים מהנתונים, ולכן מסך חדש הוא שורה בטבלה (מפה 4.3).
  הוא מחבר ואינו מחליט: הרדיוס, המינון והסף יושבים במודולים, וכל
  ערך ב-reference (תוכנית שלב 5 סעיף 7, סיכון 3).
-->
<script type="module">
  import { createBrowserDriver } from './repository/driver-browser.js';
  import { createRepository } from './repository/index.js';
  import { createOrchestrator } from './core/orchestrator.js';
  import { createEndpoint } from './screens/endpoint.js';
  import demoHandler, { DEMO_MODULE_IDS, DEMO_SEED } from './tools/demo-modules.js';
  import { create as createVetoScreen } from './screens/veto/index.js';
  import { create as createTravelerScreen } from './screens/traveler/index.js';
  import { create as createAdminScreen } from './screens/admin/index.js';
  import { create as createTts } from './connectors/tts.js';
  import { create as createStt } from './connectors/stt.js';
  import { create as createLocation } from './connectors/location.js';

  // שלוש הטבלאות, ומאיפה הן נטענות. מפה 2.1 ו-2.4.
  const TABLE_SOURCES = {
    modules: './registry/modules.json',
    allow_list: './registry/allow-list.json',
    reference: './data/reference.json',
  };

  // שני מצבי טעינה, ואותם נתונים בשניהם.
  //
  // בפיתוח הקבצים נטענים מ-Localhost (decision-04 ב2, ותוכנית שלב 1
  // סעיף 2 דרך ב). במסירה, סקריפט האיחוד של משימה 9 מזריק את אותם
  // נתונים כבלוקים בגוף הקובץ, מפני שדפדפן שנפתח מ-file:// חוסם
  // טעינת קבצים. הקוד כאן אינו יודע באיזה מצב הוא רץ: הוא מעדיף
  // בלוק בגוף הקובץ אם יש, ואם אין הוא טוען.
  async function loadTable(name) {
    const inline = document.querySelector(`script[type="application/json"][data-table="${name}"]`);
    if (inline) return JSON.parse(inline.textContent);
    const response = await fetch(TABLE_SOURCES[name]);
    if (!response.ok) throw new Error(`הטבלה ${name} לא נטענה: ${response.status}`);
    return response.json();
  }

  async function loadTables() {
    const [modules, allowList, reference] = await Promise.all(
      ['modules', 'allow_list', 'reference'].map(loadTable),
    );
    // צורת הזריעה של הדרייבר: הטבלה היא מה שה-Repository קורא,
    // ולכן reference נזרעת בערכים עצמם ולא במעטפת הקובץ.
    //
    // הישויות העסקיות נזרעות מנתוני ההדגמה כל עוד הם קיימים. זריעה
    // אינה דריסה: טבלה שכבר יש בה נתונים נשארת כפי שהיא, ולכן מה
    // שנכתב בביקור הקודם שורד רענון. ההסרה בשלב 7 היא מחיקת השורה.
    return { modules, allow_list: allowList, reference: reference.values, ...DEMO_SEED };
  }

  // טעינת ה-handlers מתוך הנתונים. עזרי בדיקה אינם נטענים כאן:
  // מערך הבדיקות מרכיב לעצמו מפה משלו, ונקודת הכניסה של המערכת
  // אינה טוענת קוד בדיקה.
  //
  // שתי צורות למודול, ושתיהן נטענות מאותה עמודה בנתונים:
  //   create: מודול שזקוק להרכבה. הוא מקבל את ה-Repository כאן,
  //     ולכן הוא אינו מייבא אותו בעצמו ואינו יודע מאיזה דרייבר
  //     הנתונים מגיעים (חוק ברזל 3 ו-7, והכרעה 4 בתוכנית שלב 3).
  //   default: handler מוכן, בלי תלות. כזה הוא מודול ההדגמה.
  //
  // מודול שהוא גם פונה (מפה 4.1) מקבל שני דברים נוספים, לפי הכרעה
  // 16 בתוכנית שלב 4: את **אותה כתובת אחת** שהמסכים מקבלים, ואת שם
  // הפונה שלו מעמודת caller בנתונים. כך BE-03 קורא ל-BE-04 דרך
  // CORE-02, הקריאה נרשמת ב-audit_log, ואין ייבוא בין מודולים
  // (חוקי ברזל 2 ו-7). שם הפונה אינו כתוב בקוד המודול, בדיוק כפי
  // שאינו כתוב בקוד המסך (מפה 4.3, מבחן מבנה 06).
  //
  // ומשלב 5 גם ציוד (מפה 4.1 גרסה 3.8): מנוע הקול וממשק הדריכה של
  // הטיימר. מודול שאינו זקוק להם מתעלם מהם.
  async function loadHandlers(modulesTable, repository, send, equipment) {
    const entries = [];
    for (const row of modulesTable.modules) {
      if (typeof row.handler !== 'string' || row.handler === '') continue;
      if (row.handler.startsWith('tests/')) continue;
      try {
        const loaded = await import(`./${row.handler}`);
        if (typeof loaded.create === 'function') {
          entries.push([row.id, loaded.create({ repository, send, caller: row.caller ?? null, ...equipment })]);
        } else if (typeof loaded.default === 'function') {
          entries.push([row.id, loaded.default]);
        }
      } catch {
        // המודול טרם נבנה. מטופל למעלה.
      }
    }
    return Object.fromEntries(entries);
  }

  // טעינת המודולים שאינם נמענים: עמודת file בטבלת המודולים (הכרעה 6
  // בתוכנית שלב 5). הם פונים בלי פעולה, ולכן ה-Orchestrator אינו
  // מנתב אליהם, והם נטענים מהנתונים ולא בייבוא (מפה 4.1 גרסה 3.8).
  // הפונקציה מחזירה את הקוד הטעון; ההרכבה עצמה, מי מקבל איזה ציוד,
  // נעשית ב-boot לפי מזהה המודול.
  async function loadModules(modulesTable) {
    const entries = [];
    for (const row of modulesTable.modules) {
      if (typeof row.file !== 'string' || row.file === '') continue;
      try {
        const loaded = await import(`./${row.file}`);
        if (typeof loaded.create === 'function') entries.push([row.id, { create: loaded.create, caller: row.caller ?? null }]);
      } catch {
        // המודול טרם נבנה.
      }
    }
    return Object.fromEntries(entries);
  }

  function render(node) {
    const app = document.getElementById('app');
    app.replaceChildren(node);
  }

  function panel(title, body) {
    const element = document.createElement('section');
    element.className = 'panel';
    const head = document.createElement('div');
    head.className = 'panel__head';
    const heading = document.createElement('h2');
    heading.textContent = title;
    head.append(heading);
    const content = document.createElement('div');
    content.className = 'panel__body';
    content.append(body);
    element.append(head, content);
    return element;
  }

  function failure(message) {
    const element = document.createElement('div');
    element.className = 'message message--error';
    element.textContent = message;
    return element;
  }

  function button(label, onClick, primary = false) {
    const element = document.createElement('button');
    element.type = 'button';
    element.className = primary ? 'btn btn--primary' : 'btn';
    element.textContent = label;
    element.addEventListener('click', onClick);
    return element;
  }

  async function boot() {
    const seed = await loadTables();
    const driver = createBrowserDriver({ seed });
    const repository = createRepository(driver);

    // ערכי ה-reference שמסך או מתאם צריך, מוזרקים בזמן ההרכבה.
    //
    // מפה 2.4 מטילה על FE-05 לקרוא את מפתחות הסוללה ואת משפט
    // הבטיחות, ועל CONN-02 ו-CONN-03 את הקול ואת קצב הדגימה, אבל מסך
    // אינו קורא ל-Repository (doc-build-03-interfaces סעיף 5) ומתאם
    // אינו מכיר אותו. ההזרקה כאן פותרת את זה בלי פעולה חדשה: הם
    // מקבלים ערכים, ולא גישה.
    //
    // ערך חסר עובר כמות שהוא, null או undefined, ואינו מומצא כאן.
    // מי שאינו יכול לתפקד בלעדיו הוא שמחזיר E-REF-EMPTY (מפה 4.5:
    // "היכן נזרק: הליבה"; חוק ברזל 5).
    function referenceFor(keys) {
      return Object.freeze(Object.fromEntries(keys.map((key) => [key, repository.getRef(key)])));
    }

    // שם הפונה של מסך אינו כתוב כאן: הוא תכונה של המודול בטבלת
    // המודולים, ולכן הוספת מסך היא שורה בנתונים (מפה 4.3, מבחן
    // מבנה 06). מודול בלי שם פונה אינו יכול לשלוח מעטפה.
    function callerOf(moduleId) {
      const row = repository.getModule(moduleId);
      if (!row || typeof row.caller !== 'string' || row.caller === '') {
        throw new Error(`למודול ${moduleId} אין שם פונה בטבלת המודולים`);
      }
      return row.caller;
    }

    // --- המתאמים: ציוד מהמכשיר, מפה 4.1 גרסה 3.8 ---
    //
    // מופע אחד של מנוע הקול לכל מי שמדבר (הכרעה 3): FE-04, BE-03
    // ו-FE-05. כך stop של אחד עוצר את מה שהאחר התחיל, ואירועי
    // ההשמעה מגיעים למסך לתצוגה. שפת הזיהוי היא שפת החוזה; המתאם
    // מתרגם אותה למנוע (הכרעה 16).
    const voice = createTts({
      engine: globalThis.speechSynthesis ?? null,
      Utterance: globalThis.SpeechSynthesisUtterance ?? null,
      reference: referenceFor(['voice_id', 'voice_rate']),
    });
    const microphone = createStt({
      Recognition: globalThis.SpeechRecognition ?? globalThis.webkitSpeechRecognition ?? null,
    });
    const location = createLocation({
      geolocation: globalThis.navigator?.geolocation ?? null,
      reference: referenceFor(['location_sample_interval_s']),
    });

    // מפת ה-handlers של ה-Orchestrator: מזהה מודול לפונקציה.
    //
    // היעד נקרא מעמודת handler בטבלת המודולים, ולכן הוספת מודול היא
    // שורה בנתונים ולא שורה כאן (מפה 4.3, והערת הקובץ: "handler הוא
    // יעד הניתוב של CORE-02"). מודול שקובצו טרם נבנה נשאר בלי
    // handler, וה-Orchestrator מחזיר עליו E-MODULE-FAILED. זו
    // התנהגות מוגדרת ולא תקלה, והיא נראית לעין.
    // הכתובת האחת נבנית לפני ה-Orchestrator, מפני שמודול שהוא פונה
    // מקבל אותה בהרכבה, וה-Orchestrator מקבל את המודולים. הקשר
    // נסגר בהפניה מושהית ולא בייבוא: מי שמטפל בבקשה הוא תמיד
    // ה-Orchestrator, וגם כשמודול הוא זה ששלח.
    let orchestrator = null;
    const send = createEndpoint({
      handle: (envelope) => {
        if (!orchestrator) throw new Error('הבקשה נשלחה לפני שההרכבה הסתיימה');
        return orchestrator.handle(envelope);
      },
    });

    // --- מודולי האוטומציה והסימולטור, מטבלת המודולים ---
    //
    // הסימולטור מוצע רק כל עוד שורותיו ברשימת המותר קיימות (הכרעה
    // 19): הסרתן בשלב 7 מכבה אותו בלי שינוי קוד. מקור הדגימות של
    // AUTO-01 הוא בורר שההרכבה מחזיקה: המכשיר, או הסימולטור כשהוא
    // מסומן. AUTO-01 אינו יודע איזה מהשניים קיבל (מבחן ההחלפה).
    const loadedModules = await loadModules(seed.modules);
    const simulatorRows = loadedModules['TOOL-01']
      ? seed.allow_list.rows.filter((row) => row.from === loadedModules['TOOL-01'].caller && row.is_demo === true)
      : [];
    const simulator = simulatorRows.length > 0 ? loadedModules['TOOL-01'].create({}) : null;
    const devState = { simulator: false };
    const simulatorOn = () => simulator !== null && devState.simulator;

    const sampleSource = {
      start: (args) => (simulatorOn() ? simulator : location).start(args),
      stop: () => {
        simulator?.stop();
        return location.stop();
      },
      available: () => true,
    };

    const timer = loadedModules['AUTO-02']
      ? loadedModules['AUTO-02'].create({ repository, send, caller: loadedModules['AUTO-02'].caller })
      : null;
    const geofence = loadedModules['AUTO-01']
      ? loadedModules['AUTO-01'].create({ repository, send, caller: loadedModules['AUTO-01'].caller, location: sampleSource })
      : null;

    const handlers = await loadHandlers(seed.modules, repository, send, { voice, timer });

    // החזרת שלב 2: כל עוד מודול שירות אינו קיים, ההדגמה עומדת
    // במקומו כדי שיהיה מה להציג על המסך. משלב 3 שני מודולים אמיתיים
    // נטענים מהשורה שבנתונים, וההדגמה כבר אינה מגיעה אליהם: התנאי
    // כאן הוא "אין handler", ולא "העדף הדגמה". ההסרה בשלב 7 היא
    // מחיקת שלוש השורות האלה ושל הקובץ.
    for (const id of DEMO_MODULE_IDS) {
      if (!handlers[id]) handlers[id] = demoHandler;
    }

    // אותה כתובת אחת מוזרקת לכל מסך ולכל מודול שהוא פונה: זה מה
    // שהופך את "כל מסך פונה לכתובת אחת" למבנה ולא להסכמה.
    orchestrator = createOrchestrator({ repository, handlers });

    // טיימר הסשנים: פעם אחת עכשיו, ואז תקופתית (הכרעה 12).
    if (timer) timer.start({});

    // הגשת מסך: המסך מקבל את הכתובת האחת, את שם הפונה שלו, את ערכיו
    // ואת הציוד שלו, ואינו מקבל את ה-Repository ואינו מקבל את
    // ה-Orchestrator.
    //
    // מסך נושא בדרך כלל מזהה מודול אחד. מסך הניהול נושא שניים,
    // מפני שהוא מאחד את FE-07 ואת FE-08 (הוכרע 12.09), ורשימת
    // המותר ממשיכה להבחין ביניהם לפי from. לכן from יכול להיות
    // שם אחד, או מפה ממזהה מודול לשם.
    function mountScreen({ moduleId, moduleIds, refKeys = [], create, equipment = {} }) {
      const host = document.createElement('div');
      const screen = create({
        host,
        from: moduleIds
          ? Object.freeze(Object.fromEntries(moduleIds.map((id) => [id, callerOf(id)])))
          : callerOf(moduleId),
        reference: referenceFor(refKeys),
        send,
        ...equipment,
      });
      return { host, screen };
    }

    // מה שההרכבה יודעת על המכשיר, למסך המטייל (הכרעות 10 ו-11):
    // דגל הסימולטור, הדגימה האחרונה של AUTO-01, והכיוון ממנה.
    const device = {
      flags: () => (simulatorOn() && simulator ? [simulator.flag] : []),
      position: () => geofence?.current().sample ?? null,
      direction: (from, to) => geofence?.direction(from, to) ?? null,
      stop: () => geofence?.current().stop_id ?? null,
    };

    // משטחי המסך. FE-05 במשימה 6, ומסך הניהול המאוחד במשימה 7.
    //
    // המסך אינו נושא כאן את שם הפונה שלו אלא את מזהה המודול, ושם
    // הפונה נגזר ממנו בטבלת המודולים. לכן החלפת שם פונה היא עריכת
    // תא בנתונים (מפה 4.3, מבחן מבנה 06).
    const SCREENS = [
      {
        moduleId: 'FE-06',
        // note_max_chars נוסף במשימה 10 של שלב 4: מפה 2.4 מונה את
        // FE-06 בין קוראי המפתח, והמסך מגביל בו את שדה ההערה.
        refKeys: ['error_human_text', 'note_max_chars'],
        create: createVetoScreen,
      },
      {
        moduleId: 'FE-05',
        refKeys: [
          'error_human_text', 'safety_opening_text', 'privacy_opening_text', 'battery_block_text',
          'battery_warn_percent', 'battery_block_percent', 'battery_resume_percent',
        ],
        create: createTravelerScreen,
        equipment: { voice, microphone, device },
      },
      {
        moduleIds: ['FE-07', 'FE-08'],
        refKeys: ['error_human_text'],
        create: createAdminScreen,
      },
    ];

    const mounted = SCREENS.map(mountScreen);
    const traveler = mounted[SCREENS.findIndex((screen) => screen.moduleId === 'FE-05')].screen;

    // --- מחזור חיי הסשן, מהמסך אל האוטומציה (הכרעה 7) ---
    //
    // המסך חושף אירועים ואינו מכיר את המודול; כאן הם מתחברים.
    // הרשאת מיקום שנדחתה מגיעה מ-AUTO-01 ולא מתשובה למעטפה של המסך,
    // ולכן היא נמסרת לו דרך notify.
    function startWalking({ session, site_id: siteId }) {
      if (!geofence || !session) return;
      geofence.start({
        session_id: session.session_id,
        site_id: siteId,
        onError: (response) => traveler.notify(response),
      }).then((started) => {
        if (!started.ok) traveler.notify(started);
      });
    }

    function stopWalking(sessionId) {
      geofence?.stop();
      if (sessionId) timer?.cancel(sessionId);
    }

    traveler.on('session:start', startWalking);
    traveler.on('session:end', ({ session_id: sessionId }) => stopWalking(sessionId));
    traveler.on('battery:block', ({ session_id: sessionId }) => stopWalking(sessionId));
    traveler.on('battery:resume', startWalking);

    // --- מפלס הסוללה, מהמכשיר אל המסך (הכרעה 10) ---
    //
    // מכשיר שאינו חושף מפלס: הנוהל אינו נורה (usecase-f-13 סעיף 8).
    if (typeof globalThis.navigator?.getBattery === 'function') {
      globalThis.navigator.getBattery().then((battery) => {
        const push = () => traveler.setBatteryLevel(Math.round(battery.level * 100));
        battery.addEventListener('levelchange', push);
        push();
      }).catch(() => {});
    }

    const shell = document.createElement('div');
    shell.append(...mounted.map((entry) => entry.host));
    if (simulator) shell.append(simulatorPanel({ repository, simulator, devState, traveler }));
    render(shell);
  }

  // פאנל הסימולטור, פיתוח בלבד (TOOL-01, ותוכנית שלב 5 סעיף 8):
  // "סימולטור במקום GPS", כפתור לכל נקודה במסלול, ו"המשך ללכת".
  // הפאנל קיים רק כל עוד שורות הסימולטור ברשימת המותר קיימות, והוא
  // נעלם בשלב 7 יחד איתן. שדה הסוללה כאן מדמה את המכשיר בשולחן
  // העבודה, כדי ש-BL-20 ייבדק בדפדפן בלי לרוקן טלפון.
  function simulatorPanel({ repository, simulator, devState, traveler }) {
    const body = document.createElement('div');

    const toggleField = document.createElement('div');
    toggleField.className = 'field';
    const toggleLabel = document.createElement('label');
    toggleLabel.className = 'field__label';
    const toggle = document.createElement('input');
    toggle.type = 'checkbox';
    toggle.addEventListener('change', () => { devState.simulator = toggle.checked; });
    toggleLabel.append(toggle, document.createTextNode(' סימולטור במקום GPS'));
    toggleField.append(toggleLabel);
    body.append(toggleField);

    // המסלול להליכה: עוגני המסלול הטעון, בסדר התחנות, עם שם הפריט.
    const points = repository.listAnchors().map((anchor) => {
      const item = repository.getItem(anchor.item_id);
      return { stop_id: item?.stop_id ?? null, lat: anchor.lat, lng: anchor.lng, name: item?.name ?? anchor.anchor_id };
    });
    simulator.load(points);

    const row = document.createElement('div');
    row.className = 'btn-row';
    points.forEach((point, index) => {
      row.append(button(`${index + 1}. ${point.name}`, () => simulator.arriveAt(index)));
    });
    row.append(button('המשך ללכת', () => simulator.walkOn()));
    row.append(button('דגימה גרועה (80 מטר)', () => simulator.arriveAt(0, { accuracy_m: 80 })));
    body.append(row);

    const batteryField = document.createElement('div');
    batteryField.className = 'field';
    const batteryLabel = document.createElement('label');
    batteryLabel.className = 'field__label';
    batteryLabel.textContent = 'סוללה, הדגמה (אחוזים)';
    const battery = document.createElement('input');
    battery.className = 'field__control';
    battery.type = 'number';
    battery.addEventListener('change', () => traveler.setBatteryLevel(Number(battery.value)));
    batteryField.append(batteryLabel, battery);
    body.append(batteryField);

    const note = document.createElement('p');
    note.className = 'text-sm text-muted';
    note.textContent = 'כלי פיתוח. הדגימות עוברות דרך ה-geofence האמיתי, והסשן מסומן simulator ואינו נספר במדדים.';
    body.append(note);

    return panel('סימולטור ההליכה', body);
  }

  boot().catch((thrown) => {
    render(failure(`ההרכבה נכשלה: ${thrown.message}`));
  });
</script>

</body>
</html>
