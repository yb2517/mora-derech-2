<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מורה הדרך 2.0</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components/index.css">
</head>
<body>

<header class="app-bar">
  <h1 class="app-bar__title">מורה הדרך 2.0</h1>
  <p class="app-bar__note">מסלול רחוב יפו, ירושלים</p>
</header>

<main class="layout" id="app"></main>

<!--
  נקודת הכניסה. מסמך הבנייה גרסה 2.2 סעיף 5, ופער 21 של שלב 1
  בהכרעת בעלת הפרויקט: הקובץ היחיד הוא גם יעד ההרצה של decision-04
  וגם המקום שמרכיב את המערכת, ולכן אין קובץ הרכבה נפרד.

  מה הקובץ הזה עושה, ואת זה בלבד:
    1. קורא את טבלאות הנתונים ואת נתוני ההדגמה.
    2. בונה את דרייבר האחסון, את ה-Repository ואת ה-Orchestrator.
    3. מגיש את המסכים, ומזריק לכל אחד את שם הפונה שלו ואת ערכי
       ה-reference שהוא צריך.

  מה הוא אינו עושה: אינו מכיל לוגיקה עסקית, אינו נוגע באחסון (חוק
  ברזל 3: רק הדרייבר), ואינו מחזיק שם פונה או ערך משתנה ככתוב בקוד.
  שניהם נקראים מהנתונים, ולכן מסך חדש הוא שורה בטבלה (מפה 4.3).
-->
<script type="module">
  import { createBrowserDriver } from './repository/driver-browser.js';
  import { createRepository } from './repository/index.js';
  import { createOrchestrator } from './core/orchestrator.js';
  import { createEndpoint } from './screens/endpoint.js';
  import demoHandler, { DEMO_MODULE_IDS } from './tools/demo-modules.js';
  import { create as createVetoScreen } from './screens/veto/index.js';
  import { create as createTravelerScreen } from './screens/traveler/index.js';
  import { create as createAdminScreen } from './screens/admin/index.js';

  // הטבלאות, ומאיפה הן נטענות. מפה 2.1 ו-2.4.
  const TABLE_SOURCES = {
    modules: './registry/modules.json',
    allow_list: './registry/allow-list.json',
    reference: './data/reference.json',
    demo: './data/demo/demo-data.json',
  };

  // הישויות שנזרעות מנתוני ההדגמה, משימה 7 בתוכנית שלב 3. כל שורה
  // בהן נושאת is_demo, וההסרה היא שלב 7: מחיקת הקובץ ומחיקת השורה
  // הזאת. הרשימה היא שמות טבלאות בלבד, ואין בה משמעות עסקית.
  const SEEDED_ENTITIES = [
    'content_items', 'approvals', 'sites', 'sources', 'institutes', 'rights_mou', 'geo_anchors',
  ];

  // שני מצבי טעינה, ואותם נתונים בשניהם.
  //
  // בפיתוח הקבצים נטענים מ-Localhost (decision-04 ב2, ותוכנית שלב 1
  // סעיף 2 דרך ב). במסירה, סקריפט האיחוד של משימה 9 מזריק את אותם
  // נתונים כבלוקים בגוף הקובץ, מפני שדפדפן שנפתח מ-file:// חוסם
  // טעינת קבצים. הקוד כאן אינו יודע באיזה מצב הוא רץ: הוא מעדיף
  // בלוק בגוף הקובץ אם יש, ואם אין הוא טוען.
  async function loadTable(name) {
    const inline = document.querySelector(`script[type="application/json"][data-table="${name}"]`);
    if (inline) return JSON.parse(inline.textContent);
    const response = await fetch(TABLE_SOURCES[name]);
    if (!response.ok) throw new Error(`הטבלה ${name} לא נטענה: ${response.status}`);
    return response.json();
  }

  async function loadTables() {
    const [modules, allowList, reference, demo] = await Promise.all(
      ['modules', 'allow_list', 'reference', 'demo'].map(loadTable),
    );
    // צורת הזריעה של הדרייבר: הטבלה היא מה שה-Repository קורא,
    // ולכן reference נזרעת בערכים עצמם ולא במעטפת הקובץ.
    const entities = Object.fromEntries(
      SEEDED_ENTITIES.map((name) => [name, demo[name] ?? []]),
    );
    return { modules, allow_list: allowList, reference: reference.values, ...entities };
  }

  // טעינת ה-handlers מתוך הנתונים. עזרי בדיקה אינם נטענים כאן:
  // מערך הבדיקות מרכיב לעצמו מפה משלו, ונקודת הכניסה של המערכת
  // אינה טוענת קוד בדיקה.
  // מודול שזקוק ל-Repository מייצא create ומקבל אותו בהזרקה, כמו
  // ה-Orchestrator וכמו הכתובת. מודול בלי תלות מייצא default.
  // ACTIONS, אם קיים, אומר מה המודול מממש בפועל בשלב הזה.
  async function loadHandlers(modulesTable, dependencies) {
    const entries = [];
    for (const row of modulesTable.modules) {
      if (typeof row.handler !== 'string' || row.handler === '') continue;
      if (row.handler.startsWith('tests/')) continue;
      try {
        const loaded = await import(`./${row.handler}`);
        const handler = typeof loaded.create === 'function'
          ? loaded.create(dependencies)
          : loaded.default;
        if (typeof handler === 'function') {
          entries.push([row.id, { handler, actions: loaded.ACTIONS ?? null }]);
        }
      } catch {
        // המודול טרם נבנה. מטופל למעלה.
      }
    }
    return Object.fromEntries(entries);
  }

  function render(node) {
    const app = document.getElementById('app');
    app.replaceChildren(node);
  }

  function panel(title, body) {
    const element = document.createElement('section');
    element.className = 'panel';
    const head = document.createElement('div');
    head.className = 'panel__head';
    const heading = document.createElement('h2');
    heading.textContent = title;
    head.append(heading);
    const content = document.createElement('div');
    content.className = 'panel__body';
    content.append(body);
    element.append(head, content);
    return element;
  }

  function failure(message) {
    const element = document.createElement('div');
    element.className = 'message message--error';
    element.textContent = message;
    return element;
  }

  async function boot() {
    const seed = await loadTables();
    const driver = createBrowserDriver({ seed });
    const repository = createRepository(driver);

    // מפת ה-handlers של ה-Orchestrator: מזהה מודול לפונקציה.
    //
    // היעד נקרא מעמודת handler בטבלת המודולים, ולכן הוספת מודול היא
    // שורה בנתונים ולא שורה כאן (מפה 4.3, והערת הקובץ: "handler הוא
    // יעד הניתוב של CORE-02"). מודול שקובצו טרם נבנה נשאר בלי
    // handler, וה-Orchestrator מחזיר עליו E-MODULE-FAILED. זו
    // התנהגות מוגדרת ולא תקלה, והיא נראית לעין.
    const built = await loadHandlers(seed.modules, { repository });
    const handlers = Object.fromEntries(
      Object.entries(built).map(([id, entry]) => [id, entry.handler]),
    );

    // ההחזרה, ומשלב 3 היא לפי פעולה ולא לפי מודול.
    //
    // מודול שנבנה חלקית מצהיר ב-ACTIONS מה הוא מממש. פעולה שברשימה
    // מגיעה אליו, וכל השאר ממשיכה להדגמה ומסומנת is_demo. בלי זה
    // היו שתי אפשרויות גרועות: מודול אמיתי שאינו עונה על מחצית
    // הפעולות, או הדגמה שממשיכה לענות במקום מודול שכבר קיים.
    //
    // ההכרעה הזאת יושבת בהרכבה ולא במודול, מפני שמודול שמכיר את
    // ההדגמה הוא מודול שמייבא מודול (חוק ברזל 2). ההסרה בשלב 7 היא
    // מחיקת הלולאה הזאת ושל הקובץ.
    for (const id of DEMO_MODULE_IDS) {
      const entry = built[id];
      if (!entry) {
        handlers[id] = demoHandler;
      } else if (Array.isArray(entry.actions)) {
        const covered = new Set(entry.actions);
        handlers[id] = (request) => (covered.has(request?.action)
          ? entry.handler(request)
          : demoHandler(request));
      }
    }

    const orchestrator = createOrchestrator({ repository, handlers });

    // הכתובת האחת. נבנית פעם אחת, ואותה אחת מוזרקת לכל מסך: זה מה
    // שהופך את "כל מסך פונה לכתובת אחת" למבנה ולא להסכמה.
    const send = createEndpoint({ handle: (envelope) => orchestrator.handle(envelope) });

    // שם הפונה של מסך אינו כתוב כאן: הוא תכונה של המודול בטבלת
    // המודולים, ולכן הוספת מסך היא שורה בנתונים (מפה 4.3, מבחן
    // מבנה 06). מודול בלי שם פונה אינו יכול לשלוח מעטפה.
    function callerOf(moduleId) {
      const row = repository.getModule(moduleId);
      if (!row || typeof row.caller !== 'string' || row.caller === '') {
        throw new Error(`למודול ${moduleId} אין שם פונה בטבלת המודולים`);
      }
      return row.caller;
    }

    // ערכי ה-reference שמסך צריך, מוזרקים בזמן ההרכבה.
    //
    // מפה 2.4 מטילה על FE-05 לקרוא את מפתחות הסוללה ואת משפט
    // הבטיחות, אבל מסך אינו קורא ל-Repository (doc-build-03-interfaces
    // סעיף 5), ואין ב-4.2 פעולה שמחזירה ערכי reference. ההזרקה כאן
    // פותרת את השניים בלי פעולה חדשה ובלי שורה חדשה ברשימת המותר:
    // המסך מקבל ערכים, ולא גישה.
    //
    // ערך חסר עובר כמות שהוא, null או undefined, ואינו מומצא כאן.
    // המסך שאינו יכול לתפקד בלעדיו הוא שמחזיר E-REF-EMPTY (מפה 4.5:
    // "היכן נזרק: הליבה"; חוק ברזל 5).
    function referenceFor(keys) {
      return Object.freeze(Object.fromEntries(keys.map((key) => [key, repository.getRef(key)])));
    }

    // הגשת מסך: המסך מקבל את הכתובת האחת, את שם הפונה שלו ואת
    // ערכיו, ואינו מקבל את ה-Repository ואינו מקבל את ה-Orchestrator.
    //
    // מסך נושא בדרך כלל מזהה מודול אחד. מסך הניהול נושא שניים,
    // מפני שהוא מאחד את FE-07 ואת FE-08 (הוכרע 12.09), ורשימת
    // המותר ממשיכה להבחין ביניהם לפי from. לכן from יכול להיות
    // שם אחד, או מפה ממזהה מודול לשם.
    function mountScreen({ moduleId, moduleIds, refKeys = [], create }) {
      const host = document.createElement('div');
      create({
        host,
        from: moduleIds
          ? Object.freeze(Object.fromEntries(moduleIds.map((id) => [id, callerOf(id)])))
          : callerOf(moduleId),
        reference: referenceFor(refKeys),
        send,
      });
      return host;
    }

    // משטחי המסך. FE-05 במשימה 6, ומסך הניהול המאוחד במשימה 7.
    //
    // המסך אינו נושא כאן את שם הפונה שלו אלא את מזהה המודול, ושם
    // הפונה נגזר ממנו בטבלת המודולים. לכן החלפת שם פונה היא עריכת
    // תא בנתונים (מפה 4.3, מבחן מבנה 06).
    const SCREENS = [
      { moduleId: 'FE-06', refKeys: ['error_human_text'], create: createVetoScreen },
      {
        moduleId: 'FE-05',
        refKeys: [
          'error_human_text', 'safety_opening_text', 'privacy_opening_text', 'battery_block_text',
          'battery_warn_percent', 'battery_block_percent', 'battery_resume_percent',
        ],
        create: createTravelerScreen,
      },
      {
        moduleIds: ['FE-07', 'FE-08'],
        refKeys: ['error_human_text'],
        create: createAdminScreen,
      },
    ];

    if (SCREENS.length > 0) {
      const shell = document.createElement('div');
      shell.append(...SCREENS.map(mountScreen));
      render(shell);
      return;
    }

    render(panel('ההרכבה', compositionReport(repository, seed, handlers)));
  }

  // דוח ההרכבה: מה נטען ומה נרשם. אינו שולח מעטפה ואינו כותב שורה,
  // מפני ש-audit_log הוא יומן append-only של המערכת, ובדיקה עצמית
  // שרצה בכל טעינת דף הייתה מזהמת אותו. הפרק הזה מוחלף בהגשת
  // המסכים במשימה 5.
  function compositionReport(repository, seed, handlers) {
    const rows = [
      ['מודולים רשומים', seed.modules.modules.length],
      ['שורות ברשימת המותר', seed.allow_list.rows.length],
      ['מפתחות בטבלת ה-reference', Object.keys(seed.reference).length],
      ['פונים מוכרים', repository.listCallers().length],
      ['מודולים עם handler', Object.keys(handlers).length],
      ['שורות ביומן הבקשות', repository.listAudit().length],
    ];

    const table = document.createElement('table');
    table.className = 'table';
    for (const [label, value] of rows) {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.textContent = label;
      const td = document.createElement('td');
      td.textContent = String(value);
      tr.append(th, td);
      table.append(tr);
    }

    const note = document.createElement('p');
    note.className = 'text-sm text-muted';
    note.textContent = 'אין עדיין מסכים. ההרכבה עצמה נבדקת כאן, והמסכים נכנסים במשימות 5 עד 7.';

    const wrapper = document.createElement('div');
    wrapper.append(table, note);
    return wrapper;
  }

  boot().catch((thrown) => {
    render(failure(`ההרכבה נכשלה: ${thrown.message}`));
  });
</script>

</body>
</html>
